name: Build XECKernelPro

# 品牌化专用构建流水线。
# 使用方式:
#   1. 把本仓库推送到你自己的 GitHub 仓库
#   2. Actions -> Build XECKernelPro -> Run workflow
#   3. 跑完后在 "Artifacts" 里下载打好的 XECkernelPro 管理器 APK
# 无需配置任何 secrets（用仓库内临时生成的自签名 key.jks）

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  SIGN_KEYSTORE_FILE: key.jks
  SIGN_KEY_ALIAS: xecpro-key
  BRAND_PACKAGE: com.xecpro.kernel
  BRAND_NAME: XECKernelPro

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT
          keytool -genkeypair \
            -alias xecpro-key \
            -keyalg RSA -keysize 2048 \
            -validity 3650 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=XECKernelPro" \
            -storetype JKS \
            -keystore xecpro-key.jks

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size2: ""
      expected_hash2: ""
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    needs: [generate-key]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write brand keystore
        env:
          KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          cp ../xecpro-key.jks . || true
          {
            echo KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo KEY_ALIAS='xecpro-key'
            echo KEY_PASSWORD="$KEY_PASSWORD"
            echo KEYSTORE_FILE='xecpro-key.jks'
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build branded manager
        env:
          KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          ./gradlew clean assembleRelease \
            -PKSU_PACKAGE_NAME=${{ env.BRAND_PACKAGE }} \
            -PKSU_NAME=${{ env.BRAND_NAME }}

      - name: Upload gradle artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

  repack:
    needs: [build-manager, build-ksud, generate-key]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download ksud artifacts
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android
      - uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Place manager apk and xudc artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/x86_64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name xudc | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name xudc | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/xudc
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/xudc

      - name: Sign and repack
        env:
          KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a x86_64 \
            -K xecpro-key.jks \
            -A xecpro-key \
            -P "$KEYSTORE_PASSWORD" \
            -S "$KEY_PASSWORD" \
            --strip

      - name: Upload branded APK
        uses: actions/upload-artifact@v7
        with:
          name: XECkernelPro-manager
          path: dist/*.apk